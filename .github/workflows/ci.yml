name: CI

on:
  push:
    branches: [zig]
  pull_request:

permissions:
  contents: read
  attestations: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - run: zig fmt --check build.zig build.zig.zon src/ src_plus/ unittest_zig/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Build and test (Debug)
        run: zig build test
      - name: Test dynamic module (Debug)
        run: ./zig-out/bin/symcryptunittest noperftests dynamic:./zig-out/lib/libsymcrypt.so statusindicator +Sha256 +Aes +AesCtrDrbg +Ecdsa
      - name: Build and test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe
      - name: Test dynamic module (ReleaseSafe)
        run: ./zig-out/bin/symcryptunittest noperftests dynamic:./zig-out/lib/libsymcrypt.so statusindicator +Sha256 +Aes +AesCtrDrbg +Ecdsa

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos
          - x86_64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Cross-compile ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }}
